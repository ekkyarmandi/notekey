[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "notekey"
version = "0.1.0"
description = "CLI utilities for Obsidian vault notes: initialize note bases, search markdown files, and read note content."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-frontmatter>=1.1.0",
    "readtime>=3.0.0",
]

[project.scripts]
notekey = "notekey.main:main"

[tool.setuptools.packages.find]
include = ["notekey*"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=notekey --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
source = ["notekey"]
